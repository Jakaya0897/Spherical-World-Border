plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.144'
}

group = mod_group_id
version = mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server() }
    }
    mods {
        sphericalworldborder {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property 'mod_version', mod_version
}

jar {
    archiveFileName = "spherical-world-border-${mod_version}-neoforge-${minecraft_version}.jar"
    manifest {
        attributes([
            'Specification-Title': 'Spherical World Border',
            'Specification-Vendor': 'Jakaya',
            'Specification-Version': mod_version,
            'Implementation-Title': 'Spherical World Border',
            'Implementation-Version': mod_version,
            'Implementation-Vendor': 'Jakaya'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
