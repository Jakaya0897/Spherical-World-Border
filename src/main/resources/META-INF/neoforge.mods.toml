[[mods]]
modId="sphericalworldborder"
version="0.2.3-alpha.1"
displayName="Spherical World Border"
authors="Jakaya"
displayTest="MATCH_VERSION"
description='''
Spherical-style world boundaries for Minecraft.

Wrap east/west longitude and cross north/south poles with a 180-degree longitude shift,
while preserving normal Minecraft world and chunk coordinates for broad mod compatibility.

Alpha release for Minecraft 1.21.1 on NeoForge.
Includes optional HUD boundary warnings, a client-side visible boundary shimmer, and safe destination checks.
Safe teleporting verifies real landing support, prefers safe nearby water for water crossings, rejects bedrock as a landing surface, and pushes successful crossings inward from the trigger line to prevent shallow-angle re-trigger jitter.
'''

[[dependencies.sphericalworldborder]]
modId="neoforge"
type="required"
versionRange="[21.1.219,)"
ordering="NONE"
side="BOTH"

